<!-- Version Decleration -->
<!DOCTYPE html>
<html lang = "en">
    
    <!-- HEAD -->
    <head>
        
        <!-- Meta Data -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <!-- Title -->
        <title>Mr. Sky — Access</title>
        
        <!-- Stylesheet -->
        <link rel = "stylesheet" href = "StyleSheets/main.css">
    </head>
    
    <!-- BODY -->
    <body>
        
        <!-- Login Page -->
        <div class="login">
            
            <!-- Headings -->
            <h1>Mr. Sky</h1>
            <p>Enter password to continue</p>
            
            <!-- Input Box -->
            <input
                type="password"
                id="password"
                placeholder="Password"
            >
            
            <!-- Sending Screen -->
            <div id = "sendingScreen">
                
                <!-- Sending Text -->
                <div id = "sendingText">
                    Sending to backend
                </div>
                
                <!-- Sending Circle -->
                <div id = "sendingCircle"></div>
            </div>
            
            <!-- Enter Button -->
            <button onclick = "sendToBackend()">Enter</button>
            
            <!-- Error Message -->
            <p id = "error"></p>
        </div>
       
       <!-- Script -->
       <script src = "Scripts/main.js"></script>
    </body>
</html>
